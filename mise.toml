# Global agent tool configuration for the agent-sandbox.
# This file configures both the host development environment and is
# copied into the OCI image for sandbox use.
#
# Language runtimes are pinned to major versions for reproducibility.
# Bump intentionally and document the reason.

[tools]
# Language runtimes (core backends, pinned major versions)
node = "24"
python = "3.12"
bun = "latest"

# Agent CLIs
# opencode uses the mise registry shorthand (aqua backend) — pre-built binary,
# no node dependency at install time.
opencode = "latest"
# codex uses the npm backend (no aqua registry entry confirmed).
"npm:@openai/codex" = "latest"
# pi uses the npm backend.
"npm:@earendil-works/pi-coding-agent" = "latest"

# CLI utilities (aqua backend via registry shorthand)
# jq is installed via apt (system-wide, always available) — not duplicated here.
ripgrep = "latest"
fd = "latest"
"npm:@fission-ai/openspec" = "latest"

[settings]
experimental = true

# These tasks are for manual `mise run <task>` use inside the container.
# The CLI uses `mise exec --` directly, not `mise run`.
[tasks.opencode]
description = "Launch OpenCode"
run = "opencode"

[tasks.codex]
description = "Launch Codex"
run = "codex"

[tasks.pi]
description = "Launch Pi"
run = "pi"

[tasks.shell]
description = "Open an interactive Bash shell"
run = "bash"

[tasks.install]
description = "Symlink the mise-msb wrapper into ~/.local/bin"
run = "bun bin/mise-msb install"
